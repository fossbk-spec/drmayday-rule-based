name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    # ubuntu-latest (26.04) no longer ships a Python 3.9 build for setup-python; pin 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check knowledge packages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/check_packages.py --base-ref "origin/${{ github.base_ref }}"
          else
            python tools/check_packages.py
          fi
      - name: Check field references
        run: python tools/build_fields.py --check
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
